{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  {% include "includes/sidebar.html" %}
  <main class="main">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
