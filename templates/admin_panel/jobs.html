{% extends "base_app.html" %}
{% load static %}
{% block title %}Job approval{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Jobs</h1></div></div>
<div class="panel p-0">
  <table class="table mb-0">
    <thead><tr><th>Title</th><th>Company</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {% for job in jobs %}
        <tr>
          <td>{{ job.title }}</td>
          <td>{{ job.company.company_name }}</td>
          <td><span class="badge-status {{ job.status|lower }}">{{ job.get_status_display }}</span></td>
          <td>
            <button class="btn btn-sm btn-primary" data-job-action="approve" data-id="{{ job.id }}">Approve</button>
            <button class="btn btn-sm btn-outline-primary" data-job-action="reject" data-id="{{ job.id }}">Reject</button>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'js/admin.js' %}"></script>{% endblock %}
