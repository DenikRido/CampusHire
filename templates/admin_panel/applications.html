{% extends "base_app.html" %}
{% block title %}Applications{% endblock %}
{% block content %}
<div class="page-head"><div><h1>All applications</h1></div></div>
<div class="panel p-0">
  <table class="table mb-0">
    <thead><tr><th>Student</th><th>Job</th><th>Company</th><th>Status</th></tr></thead>
    <tbody>
      {% for a in applications %}
        <tr>
          <td>{{ a.student.user.email }}</td>
          <td>{{ a.job.title }}</td>
          <td>{{ a.job.company.company_name }}</td>
          <td><span class="badge-status {{ a.status|lower }}">{{ a.get_status_display }}</span></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
